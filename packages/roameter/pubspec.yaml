name: roameter
description: Android step-counter access with sensor batching, real event timestamps, and one-shot reads.
version: 0.1.0
# Local to this repo. Remove to publish.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.nttech.roameter
        pluginClass: RoameterPlugin
