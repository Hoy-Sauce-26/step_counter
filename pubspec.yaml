name: step_counter
description: A simple Flutter step counter app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Step sensing
  pedometer: ^4.0.1

  # Permissions
  permission_handler: ^11.3.1

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # State management
  flutter_riverpod: ^2.5.1

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
