name: step_counter
description: A simple Flutter step counter app.
publish_to: 'none'
version: 0.3.7+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Permissions
  permission_handler: ^12.0.3

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^1.2.0

  # State management
  flutter_riverpod: ^3.4.2

  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0

  # Step sensing. Our own: sensor batching, real event timestamps, one-shot
  # reads. The foreground service that drives it lives in android/app.
  roameter:
    path: packages/roameter

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1  # drives NotificationThrottle's timer without a real wait
  # Runs sqflite on the host VM so the database can be tested off-device.
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#303030"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
