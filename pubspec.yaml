name: step_counter
description: A simple Flutter step counter app.
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Step sensing
  # Permissions
  permission_handler: ^12.0.3

  # Local storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^1.2.0

  # State management
  flutter_riverpod: ^3.4.2

  intl: ^0.20.3
  pedometer: ^4.2.0
  flutter_local_notifications: ^22.3.0
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Runs sqflite on the host VM so the database can be tested off-device.
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#303030"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
